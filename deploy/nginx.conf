# PasarAgen: four static open agentic websites, each on its own origin.

server {
    listen 80;
    listen [::]:80;
    server_name pasar.187-124-138-96.sslip.io;
    root /var/www/pasaragen/pasar;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    # Public agent files: any agent site may read them (MVP spec 3.3).
    location ~ ^/(agent-manifest\.json|[a-z0-9_]+\.network\.json|links\.json|agent-mcp\.json|directory\.json|\.well-known/nsdeploy(-agent)?\.json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # Coded-tool sandbox worker policy.
    location = /runtime/sandbox-worker.js {
        add_header Content-Security-Policy "default-src 'none'; script-src blob:; connect-src 'none'; worker-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    location ~ .mjs$ { types { text/javascript mjs; } add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ =404; }
}

